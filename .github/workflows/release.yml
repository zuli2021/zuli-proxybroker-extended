name: Release

# On a pushed version tag: create a GitHub Release, attach prebuilt CLI binaries,
# and publish the container image to GHCR. Publication is tag-push-only: an existing
# Release blocks execution, and manually rebuilding an immutable published Release is
# not supported. Recovery from a partial publication requires a separate governed review;
# this workflow never silently replaces assets.
#
#   git tag v0.1.2 && git push origin v0.1.2
#
# The tag MUST be `v<version>` and match the version in Cargo.toml, or nothing ships.
# crates.io publication is intentionally disabled until separately reviewed and approved.
on:
  push:
    tags:
      - "v*"

# Never run two releases for the same tag at once.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Gate everything on a single check: the tag is well-formed, matches the crate version, and
  # the test suite and distributable package validation pass. All release jobs depend on this,
  # so nothing ships for a mistagged or broken commit. The resolved tag is exported for downstream jobs.
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      package_version: ${{ steps.package_version.outputs.version }}
      is_stable: ${{ steps.resolve.outputs.is_stable }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}
    steps:
      - name: Resolve and validate the release tag
        id: resolve
        env:
          REF_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Release must be triggered by a pushed tag"
            exit 1
          fi
          TAG="$REF_TAG"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::invalid tag '$TAG' (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          if printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            IS_STABLE=true
            IS_PRERELEASE=false
          else
            IS_STABLE=false
            IS_PRERELEASE=true
          fi
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'is_stable=%s\n' "$IS_STABLE" >> "$GITHUB_OUTPUT"
          printf 'is_prerelease=%s\n' "$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      # Published Releases are immutable. Exact HTTP 404 is the only accepted proof of absence;
      # an existing Release or any other API failure blocks all tests and publication jobs.
      - name: Verify the GitHub Release does not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/release-lookup.json"
          error_file="$RUNNER_TEMP/release-lookup.err"

          set +e
          gh api "repos/$GH_REPO/releases/tags/$TAG" \
            > "$response_file" \
            2> "$error_file"
          lookup_status=$?
          set -e

          if [ "$lookup_status" -eq 0 ]; then
            echo "::error::Release $TAG already exists; immutable Releases cannot be rebuilt"
            exit 1
          fi

          if ! grep -Fq 'HTTP 404' "$error_file"; then
            echo "::error::Release absence was not proven by an exact HTTP 404"
            cat "$error_file" >&2
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Verify the tag matches the crate version
        id: package_version
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          VERSION="$(cargo metadata --format-version 1 --no-deps --locked | jq -r '.packages[0].version')"
          echo "Cargo.toml version: $VERSION"
          echo "Release tag:        $TAG"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag '$TAG' does not match Cargo.toml version 'v$VERSION'"
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      # The full test suite is designed to run offline (local mock servers only), so it is
      # safe in CI and catches regressions before anything ships.
      - name: Test
        run: cargo test --all-features --locked

      - name: Package validation
        run: cargo package --locked

  # Create the GitHub Release exactly once, after verify proved it absent. A pushed git tag is
  # not itself a Release, so this single creation-only job also prevents matrix creation races.
  create-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub Release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          IS_PRERELEASE: ${{ needs.verify.outputs.is_prerelease }}
        run: |
          release_args=(--title "$TAG" --generate-notes --verify-tag)
          if [ "$IS_PRERELEASE" = "true" ]; then
            release_args+=(--prerelease)
          fi
          gh release create "$TAG" "${release_args[@]}"

  binaries:
    needs: [verify, create-release]
    permissions:
      contents: write # upload assets to the release
    strategy:
      fail-fast: false
      # Host per target. TLS is ring-only rustls (no aws-lc-rs — see Cargo.toml), so the graph
      # cross-compiles to musl with just `musl-tools`. The static musl targets are the portable,
      # libc-free Linux binaries the installer + scratch Docker image ship; the gnu targets remain
      # for maximum host compatibility.
      #
      # Two targets are cross-compiled rather than host-native, because their "native" runner does
      # not build cleanly on GitHub's fleet:
      #   - aarch64-unknown-linux-musl builds on x86_64 `ubuntu-latest`: upload-rust-binary-action
      #     drives it through `cross`, which needs an x86_64 host (on `ubuntu-24.04-arm` it tries to
      #     install the x86_64 toolchain on an arm64 host and fails). x86→arm64-musl via cross is the
      #     standard path.
      #   - x86_64-apple-darwin builds on Apple-Silicon `macos-14` (rustc cross-compiles x86 with the
      #     target added): the Intel `macos-13` runner is being retired and queues indefinitely.
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      # ring assembles its optimized routines with NASM on Windows/MSVC.
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1

      # The musl targets link against musl libc; musl-tools provides the musl-gcc ring's C code
      # needs. (Only reachable now that the graph is aws-lc-free — see the matrix comment.)
      - name: Install musl tools (musl targets)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      # Builds the `proxybroker` binary for the target, archives it (tar.gz on unix, zip on
      # Windows) WITH the licences — the binary embeds the DB-IP geo database (CC BY 4.0), so
      # its attribution (LICENSE-DATA) and NOTICE must travel with every distributed copy —
      # writes a SHA-256 checksum, and uploads everything to the tag's GitHub Release. `ref`
      # pins the target release/tag selected exclusively by the pushed tag event.
      - name: Build and upload CLI binary
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: proxybroker
          target: ${{ matrix.target }}
          ref: refs/tags/${{ needs.verify.outputs.tag }}
          locked: true # build against the committed Cargo.lock, matching the published crate
          archive: proxybroker-$tag-$target
          include: LICENSE,LICENSE-DATA,NOTICE,README.md
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  # Publish the FROM-scratch image to the GitHub Container Registry only after the GitHub Release
  # and every binary upload complete. Every validated release receives a version tag; only a
  # canonical stable release receives `latest`. Auth is the built-in GITHUB_TOKEN.
  docker:
    needs: [verify, create-release, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute the image reference + tags WITHOUT interpolating the ref into a shell. The image
      # path is lowercased automatically (GHCR requires it; `github.repository` may carry capitals).
      # The validated tag from `verify` drives a semver pattern that emits the bare version
      # (v0.1.2 -> 0.1.2). Disable metadata-action's implicit latest behavior so the only
      # `latest` tag below is explicitly gated by verify's strict stable-tag output.
      # metadata-action also emits an org.opencontainers.image.source label linking the package to
      # this repo — required or the first push to a new package 403s even with packages: write.
      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.is_stable == 'true' }}

      # Reuses the repo-root Dockerfile + context (linux/amd64, matching the ci.yml smoke test). No
      # QEMU multi-arch: the Dockerfile compiles the crate from source, so emulated aarch64 builds
      # would be prohibitively slow — the aarch64 story is the musl binary shipped by `binaries`.
      - name: Build and push to GHCR
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
