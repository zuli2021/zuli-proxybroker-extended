name: Docs

# Build the mdBook (book/) and deploy it to GitHub Pages. Runs on pushes to main that touch the
# book (or this workflow) + manual dispatch. Requires Pages to be enabled once in the repo settings
# with Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Least privilege for the deploy: read the repo, write Pages, mint the OIDC token deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time; don't cancel an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.5.3"
  MDBOOK_SHA256: "e2fd508a4fac06cbaa9f88b97d27bdc3b55a08946304ca845879fe26a3699e11"

jobs:
  build:
    name: build mdBook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Install the pinned mdBook release only after verifying GitHub's recorded SHA-256 digest.
      - name: Install mdBook
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.mdbook"
          archive="$RUNNER_TEMP/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --proto '=https' \
            --tlsv1.2 \
            --output "$archive" \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s\n' "$MDBOOK_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          printf '%s  %s\n' "$MDBOOK_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" --directory="$HOME/.mdbook"
          echo "$HOME/.mdbook" >> "$GITHUB_PATH"
          version_output="$("$HOME/.mdbook/mdbook" --version)"
          printf '%s\n' "$version_output"
          printf '%s\n' "$version_output" | grep -Fx "mdbook v${MDBOOK_VERSION}"

      - name: Build
        run: mdbook build book

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: book/book

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
