name: v1.1.0 Release Recovery

on:
  workflow_dispatch:

concurrency:
  group: release-recovery-v1.1.0
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: v1.1.0
  RELEASE_ID: "367111429"
  EXPECTED_COMMIT: 2a64a884d41c21fffccb29f1479fb87ddb77053b
  RELEASE_NAME: "Zuli ProxyBroker Extended v1.1.0 — Rust Proxy Scraper, Checker & Rotating Proxy Server"
  RELEASE_BODY_MARKER: "Zuli ProxyBroker Extended v1.1.0 is a fast Rust proxy scraper"

jobs:
  verify-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      asset_contract_sha256: ${{ steps.verify.outputs.asset_contract_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: v1.1.0
          fetch-depth: 0

      - name: Verify preserved draft and all checksum pairs
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DOCKERHUB_MIRROR_ENABLED: ${{ vars.DOCKERHUB_MIRROR_ENABLED }}
        run: |
          set -euo pipefail

          test "$GH_REPO" = "zuli2021/zuli-proxybroker-extended"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$EXPECTED_COMMIT"

          if [ "${DOCKERHUB_MIRROR_ENABLED:-}" = "true" ]; then
            echo "::error::Docker Hub mirror is enabled but Docker Hub publication is not authorized"
            exit 1
          fi

          release_file="$RUNNER_TEMP/draft.json"
          expected_file="$RUNNER_TEMP/expected.txt"
          actual_file="$RUNNER_TEMP/actual.txt"
          metadata_file="$RUNNER_TEMP/asset-metadata.txt"
          download_dir="$RUNNER_TEMP/assets"

          mkdir -p "$download_dir"

          gh api \
            "repos/$GH_REPO/releases/$RELEASE_ID" \
            > "$release_file"

          jq -e \
            --argjson release_id "$RELEASE_ID" \
            --arg tag "$TAG" \
            --arg release_name "$RELEASE_NAME" \
            --arg body_marker "$RELEASE_BODY_MARKER" '
              .id == $release_id and
              .tag_name == $tag and
              .name == $release_name and
              ((.body // "") | startswith($body_marker)) and
              .draft == true and
              .prerelease == false and
              .published_at == null and
              (.assets | length) == 16 and
              (([.assets[].name] | length) ==
               ([.assets[].name] | unique | length)) and
              all(.assets[];
                .state == "uploaded" and
                .size > 0 and
                (.digest | test("^sha256:[0-9a-f]{64}$"))
              )
            ' "$release_file"

          targets=(
            x86_64-unknown-linux-gnu
            aarch64-unknown-linux-gnu
            x86_64-unknown-linux-musl
            aarch64-unknown-linux-musl
            x86_64-apple-darwin
            aarch64-apple-darwin
            x86_64-pc-windows-msvc
            aarch64-linux-android
          )

          : > "$expected_file"

          for target in "${targets[@]}"; do
            base="proxybroker-$TAG-$target"

            if [ "$target" = "x86_64-pc-windows-msvc" ]; then
              printf '%s.zip\n' "$base" >> "$expected_file"
            else
              printf '%s.tar.gz\n' "$base" >> "$expected_file"
            fi

            printf '%s.sha256\n' "$base" >> "$expected_file"
          done

          LC_ALL=C sort -o "$expected_file" "$expected_file"

          jq -r '.assets[].name' "$release_file" |
            LC_ALL=C sort > "$actual_file"

          cmp "$expected_file" "$actual_file"

          jq -r '.assets[] | [.id, .name] | @tsv' "$release_file" |
          while IFS=$'\t' read -r asset_id asset_name; do
            gh api \
              -H 'Accept: application/octet-stream' \
              "repos/$GH_REPO/releases/assets/$asset_id" \
              > "$download_dir/$asset_name"

            test -s "$download_dir/$asset_name"
          done

          pair_count=0

          for target in "${targets[@]}"; do
            base="proxybroker-$TAG-$target"

            if [ "$target" = "x86_64-pc-windows-msvc" ]; then
              archive="$base.zip"
            else
              archive="$base.tar.gz"
            fi

            checksum="$base.sha256"

            test -s "$download_dir/$archive"
            test -s "$download_dir/$checksum"
            test "$(wc -l < "$download_dir/$checksum")" = '1'

            checksum_archive="$(
              awk '
                NR == 1 {
                  name=$2
                  sub(/^\*/, "", name)
                  print name
                }
              ' "$download_dir/$checksum"
            )"

            test "$checksum_archive" = "$archive"

            (
              cd "$download_dir"
              sha256sum -c "$checksum"
            )

            pair_count=$((pair_count + 1))
          done

          test "$pair_count" = '8'

          jq -r '
            .assets[] |
            [.name, (.size | tostring), .digest] |
            @tsv
          ' "$release_file" |
            LC_ALL=C sort > "$metadata_file"

          asset_contract_sha256="$(
            sha256sum "$metadata_file" |
            awk '{print $1}'
          )"

          test "$(
            printf '%s' "$asset_contract_sha256" |
            grep -Ec '^[0-9a-f]{64}$'
          )" = '1'

          printf 'asset_contract_sha256=%s\n' \
            "$asset_contract_sha256" \
            >> "$GITHUB_OUTPUT"

  publish-ghcr:
    needs: verify-draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: v1.1.0
          fetch-depth: 0

      - name: Verify exact release commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$EXPECTED_COMMIT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute canonical tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=v1.1.0
            type=raw,value=latest

      - name: Build and publish canonical GHCR image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          printf '%s\n' "$IMAGE_DIGEST"
          printf '%s' "$IMAGE_DIGEST" |
            grep -Eq '^sha256:[0-9a-f]{64}$'

  publish-release:
    needs:
      - verify-draft
      - publish-ghcr
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Reverify state and publish preserved draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DOCKERHUB_MIRROR_ENABLED: ${{ vars.DOCKERHUB_MIRROR_ENABLED }}
          EXPECTED_ASSET_CONTRACT: ${{ needs.verify-draft.outputs.asset_contract_sha256 }}
          IMAGE_DIGEST: ${{ needs.publish-ghcr.outputs.image_digest }}
        run: |
          set -euo pipefail

          if [ "${DOCKERHUB_MIRROR_ENABLED:-}" = "true" ]; then
            echo "::error::Docker Hub mirror became enabled; refusing Release publication"
            exit 1
          fi

          printf '%s' "$IMAGE_DIGEST" |
            grep -Eq '^sha256:[0-9a-f]{64}$'

          tag_ref_file="$RUNNER_TEMP/tag-ref.json"

          gh api \
            "repos/$GH_REPO/git/ref/tags/$TAG" \
            > "$tag_ref_file"

          jq -e \
            --arg expected "$EXPECTED_COMMIT" '
              .object.type == "commit" and
              .object.sha == $expected
            ' "$tag_ref_file"

          before_file="$RUNNER_TEMP/before.json"
          metadata_file="$RUNNER_TEMP/asset-metadata.txt"

          gh api \
            "repos/$GH_REPO/releases/$RELEASE_ID" \
            > "$before_file"

          jq -e \
            --argjson release_id "$RELEASE_ID" \
            --arg tag "$TAG" \
            --arg release_name "$RELEASE_NAME" \
            --arg body_marker "$RELEASE_BODY_MARKER" '
              .id == $release_id and
              .tag_name == $tag and
              .name == $release_name and
              ((.body // "") | startswith($body_marker)) and
              .draft == true and
              .prerelease == false and
              .published_at == null and
              (.assets | length) == 16 and
              (([.assets[].name] | length) ==
               ([.assets[].name] | unique | length)) and
              all(.assets[];
                .state == "uploaded" and
                .size > 0 and
                (.digest | test("^sha256:[0-9a-f]{64}$"))
              )
            ' "$before_file"

          jq -r '
            .assets[] |
            [.name, (.size | tostring), .digest] |
            @tsv
          ' "$before_file" |
            LC_ALL=C sort > "$metadata_file"

          current_contract="$(
            sha256sum "$metadata_file" |
            awk '{print $1}'
          )"

          test "$current_contract" = "$EXPECTED_ASSET_CONTRACT"

          payload="$RUNNER_TEMP/publish.json"
          response="$RUNNER_TEMP/response.json"
          error_file="$RUNNER_TEMP/publish.err"

          jq -n '
            {
              draft: false,
              prerelease: false,
              make_latest: "true"
            }
          ' > "$payload"

          set +e

          gh api \
            --method PATCH \
            "repos/$GH_REPO/releases/$RELEASE_ID" \
            --input "$payload" \
            > "$response" \
            2> "$error_file"

          patch_status=$?

          set -e

          observed="$RUNNER_TEMP/observed.json"

          gh api \
            "repos/$GH_REPO/releases/$RELEASE_ID" \
            > "$observed"

          if [ "$patch_status" -ne 0 ]; then
            cat "$error_file" >&2
            echo "::error::Publication outcome ambiguous; no second mutation attempted"
            exit 1
          fi

          jq -e \
            --argjson release_id "$RELEASE_ID" \
            --arg tag "$TAG" \
            --arg release_name "$RELEASE_NAME" \
            --arg body_marker "$RELEASE_BODY_MARKER" '
              .id == $release_id and
              .tag_name == $tag and
              .name == $release_name and
              ((.body // "") | startswith($body_marker)) and
              .draft == false and
              .prerelease == false and
              .published_at != null and
              (.assets | length) == 16 and
              (([.assets[].name] | length) ==
               ([.assets[].name] | unique | length)) and
              all(.assets[];
                .state == "uploaded" and
                .size > 0
              )
            ' "$observed"

          gh api \
            "repos/$GH_REPO/releases/latest" \
            > "$RUNNER_TEMP/latest.json"

          test "$(
            jq -r '.id' "$RUNNER_TEMP/latest.json"
          )" = "$RELEASE_ID"
